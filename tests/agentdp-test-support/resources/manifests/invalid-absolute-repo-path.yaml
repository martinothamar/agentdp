apiVersion: agentdp.dev/v1alpha1
kind: Agent
metadata:
  name: altinn-studio
spec:
  phase: Running
  replicas: 1
  template:
    image:
      os: archlinux
    user:
      name: agent
    resources:
      cpus: 1
      memory: 1G
      storage: 8G
    network:
      mode: mediated
      ports:
        ssh:
          guest: 22
          protocol: tcp
    bootstrap:
      repos:
        - url: https://example.com/repo.git
          path: /data/code/repo
    plugins:
      codex:
        auth: mediated
      github:
        auth: mediated
      code_server: {}
    secrets: []
