model = "gpt-5.5"
model_reasoning_effort = "high"
tool_output_token_limit = 25000
# Leave room for native compaction near the 272-273k context window.
# Formula: 273000 - (tool_output_token_limit + 15000)
# With tool_output_token_limit=25000 => 273000 - (25000 + 15000) = 233000
model_auto_compact_token_limit = 233000
web_search = "cached"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest", "--browser=chromium", "--executable-path=/usr/bin/chromium"]
env = { PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/usr/bin/chromium", PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH = "/usr/bin/chromium" }

[agents]
max_threads = 6
max_depth = 1

[features]
unified_exec = true
apply_patch_freeform = true
shell_snapshot = true
multi_agent = true
collaboration_modes = true
steer=true
terminal_resize_reflow = true
goals = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter"]
