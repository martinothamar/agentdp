apiVersion: agentdp.dev/v1alpha1
kind: Agent
metadata:
  name: test-podman-docker-api
spec:
  phase: Running
  replicas: 1
  template:
  
    image:
      os: archlinux
  
    user:
      name: agent
  
    resources:
      cpus: 2
      memory: 2G
      storage: 10G
  
    network:
      mode: mediated
      allow: all
      ports:
        ssh:
          guest: 22
          protocol: tcp
  
    bootstrap:
      packages:
        - python
  
      shell:
        - chmod +x /data/home/podman-docker-api-smoke.py
  
      healthchecks:
        - name: ssh
          kind: tcp
          target: 127.0.0.1:22
          timeout: 5m
        - name: podman_docker_api_smoke
          kind: command
          command: /data/home/podman-docker-api-smoke.py
          timeout: 60s
  
    plugins:
      podman:
        docker_api: true
    secrets: []
