[workspace]
members = [
    "src/core/agentdp-core",
    "src/core/agentdp-protocol",
    "src/apps/agentdp-cli",
    "src/apps/agentdp-server",
    "src/apps/agentdp-guest",
    "src/backends/agentdp-qemu",
    "src/libs/agentdp-base64",
    "src/libs/agentdp-crypto",
    "src/libs/agentdp-ds",
    "src/libs/agentdp-network",
    "src/libs/agentdp-platform",
    "src/libs/agentdp-rand",
    "tests/agentdp-test-support",
    "tests/agentdp-network-tests",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"
unreachable_pub = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
redundant_pub_crate = "allow"
unwrap_used = { level = "deny", priority = -1 }
expect_used = { level = "deny", priority = -1 }
panic = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
iter_with_drain = "allow"

[workspace.dependencies]
# Local workspace crates.
agentdp-core = { path = "src/core/agentdp-core" }
agentdp-base64 = { path = "src/libs/agentdp-base64" }
agentdp-crypto = { path = "src/libs/agentdp-crypto" }
agentdp-ds = { path = "src/libs/agentdp-ds" }
agentdp-network = { path = "src/libs/agentdp-network" }
agentdp-platform = { path = "src/libs/agentdp-platform" }
agentdp-protocol = { path = "src/core/agentdp-protocol" }
agentdp-qemu = { path = "src/backends/agentdp-qemu" }
agentdp-rand = { path = "src/libs/agentdp-rand" }
agentdp-network-tests = { path = "tests/agentdp-network-tests" }
agentdp-test-support = { path = "tests/agentdp-test-support" }

# Dev/test dependencies. `base64` is a reference implementation for tests/fuzzing.
base64 = "0.22.1"
criterion = "0.8.2"
loom = "0.7.2"
proptest = "1.11.0"

clap = { version = "4.6.1", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
flate2 = "1.1.9"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
libc = "0.2.186"
mio = { version = "1.2.1", features = ["net", "os-poll"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.44"

# TLS/certificate stack. Keep features explicit so rustls/rcgen do not pull unused crypto providers.
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3.44"
tokio-rustls = { version = "0.26.4", default-features = false }
webpki-roots = "1.0.7"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
serde_yaml = "0.9.34"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "proto-dhcpv4", "socket-tcp", "socket-udp", "auto-icmp-echo-reply"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
windows-sys = "0.61.2"
